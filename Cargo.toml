[package]
name = "cade"
version = "0.1.3"
edition = "2024"
license = "EUPL-1.2"
description = "an intelligent, cascading environment manager"
repository = "https://github.com/manic-systems/cade"

[profile.release]
strip = true
opt-level = "z"
codegen-units = 1
# lto = true
# panic = "abort"

[dependencies]
anyhow = "1.0.104"
cognos = "1.0.1"
libc = "0.2.189"
microxdg = "0.2.0"
pound = "0.1.6"
rusqlite = { version = "0.40.2", features = ["fallible_uint"] }
serde = { version = "1.0.229", features = ["derive"] }
shlex = "2.0.1"
serde_json = "1.0.151"
toml = "1.1.5"
whoami = { version = "2.1.3", default-features = false, features = ["std"] }
ignore = "0.4.33"
